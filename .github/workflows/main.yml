name: SEACE Scraper Automatico

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *' # Todos los días a las 8:00 a.m.

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso vital para que el robot pueda guardar archivos en tu repositorio
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4 pandas

      - name: Ejecutar el script
        run: python scraper.py

      - name: Subir y guardar el archivo generado en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add convocatorias_seace_*.csv
          git commit -m "Actualizacion automatica de convocatorias SEACE" || exit 0
          git push
